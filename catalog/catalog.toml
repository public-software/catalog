# Public Software — the catalog.
#
# Source of truth for the organization: every repository, its dependency ring, the layers it
# serves, the wave it starts in, its purpose and its planned contents. GitHub descriptions,
# topics, custom properties, the org README tables, the site and the brand are generated from it.
#
# Canonical copy: https://github.com/public-software/catalog (catalog/catalog.toml). The bootstrap
# kit vendors it as config/catalog.toml; ./bootstrap.sh 00 warns when the two differ and step 05
# pushes the kit copy. Validate with `python3 lib/catalog.py validate` (kit) or `pub catalog validate`.
# Schema: catalog.schema.json next to this file (JSON Schema 2020-12).

[catalog]
version = 1
org     = "public-software"
site    = "https://publicsoftware.dev"

[[repo]]
name     = "catalog"
ring     = "spin"
wave     = 1
layers   = ["L18"]
purpose  = "Machine-readable ledger + roadmap; source of truth for GitHub descriptions, topics, properties and the org README."
contents = "catalog.toml aggregate · schema · site generator · plugin registry · blob-free hardware list"

[[repo]]
name     = "interfaces"
ring     = "spine"
wave     = 1
layers   = ["all"]
purpose  = "Every cross-repo API as WIT packages and wire schemas, with generated binding crates."
contents = "public:doc/* · ui/* · plugin/* · identity/* · store/* · media/* · net/*; pub-interfaces-* crates"

[[repo]]
name     = "suite"
ring     = "spine"
wave     = 1
layers   = ["all"]
purpose  = "The superproject: lockfile pinning every crate, nightly whole-suite build, compatibility matrix, release trains, reference images."
contents = "Cargo.lock · compat-matrix · release notes assembler · reference platform images"

